# Build the application image and publish it to GHCR.
#
# TrueNAS deploys StockBrain as a custom app from a pasted Compose file, which
# has no repository next to it to build from. So every push to main produces an
# immutable image tagged by commit, plus a moving `main` tag, and a release tag
# produces `vX.Y.Z`. The NAS pulls a tag; rolling back is changing the tag.
#
# The package is public because the repository is public; a private repository
# would need a read token on the NAS. Nothing here needs a secret beyond the
# workflow's own GITHUB_TOKEN.

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/TradingAgents is a submodule; the Dockerfile COPYs from it.
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stockbrain
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's own cache backend: needs no extra registry package and
          # no permission beyond the job's. A docs-only push then reuses the
          # frontend and Python layers instead of rebuilding them.
          cache-from: type=gha
          cache-to: type=gha,mode=max
