name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockbrain_test
          POSTGRES_USER: stockbrain
          POSTGRES_PASSWORD: ci-password
        options: >-
          --health-cmd "pg_isready -U stockbrain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://stockbrain:ci-password@127.0.0.1:5432/stockbrain_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip sync requirements-dev.txt
      - run: uv pip install --no-deps -e .
      - name: Format check
        run: .venv/bin/ruff format --check .
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type check
        run: .venv/bin/mypy stockbrain tests
      - name: Tests
        # No test in this suite may submit a Trading 212 live order. Tests
        # marked `live` require real credentials and are never run here.
        run: .venv/bin/python -m pytest -m "not live"
      - name: Dependency audit
        run: .venv/bin/pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build application image
        run: docker build -f backend/Dockerfile -t stockbrain:ci .
