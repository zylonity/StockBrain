[project]
name = "stockbrain"
version = "0.1.0"
description = "Self-hosted event-driven equity research and trade-proposal system"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.141,<0.142",
    # Explicit floor rather than relying on FastAPI's transitive range. Starlette
    # <1.3.1 carries advisories that hit code paths this app uses directly:
    # PYSEC-2026-1942 (quadratic Range parsing in FileResponse, used to serve the
    # SPA), PYSEC-2026-2281 (StaticFiles path handling), PYSEC-2026-248/161
    # (request.url rebuilt from an unvalidated Host header) and PYSEC-2026-249
    # (form-parsing limits not enforced).
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.34,<0.40",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.28,<0.29",
    "structlog>=25.1,<26.0",
    # Imported directly by the Alpaca news stream. Also pulled in by
    # uvicorn[standard], but an explicit import deserves an explicit dependency.
    "websockets>=14.0,<18.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",   # <9.0.3: PYSEC-2026-1845 (predictable /tmp basetemp)
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2.0",
    "types-python-dateutil>=2.9,<3.0",
    "asgi-lifespan>=2.1,<3.0",
    "pip-audit>=2.9,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockbrain"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["stockbrain", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes -- important for this project
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
    "ASYNC",
    "S",         # bandit
]
ignore = [
    "S101",   # assert is used deliberately for invariants in service code
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# The exception names come straight from the specification's vocabulary
# ("EXECUTION_AMBIGUOUS", "ProposalAlreadyConsumed"). Appending "Error" to each
# would make the code harder to trace back to the spec than the convention is
# worth.
"stockbrain/errors.py" = ["N818"]
# The module name is fixed by the specification's package layout. Absolute
# imports mean it never shadows the stdlib `logging` for anything else.
"stockbrain/logging.py" = ["A005"]
# A CLI entrypoint run by the container before logging is configured; printing
# to stdout/stderr is its entire purpose.
"stockbrain/validate_config.py" = ["T201"]
# The live provider smoke test prints the observed API contract; reporting what
# the provider actually returned is its entire purpose.
"tests/integration/test_deepseek_live.py" = ["T201"]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stockbrain"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance (DATABASE_URL_TEST)",
    "live: requires real third-party API credentials; never run in CI by default",
]
filterwarnings = ["error::DeprecationWarning:stockbrain.*"]
